<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{PREFIX}}./" aria-label="Haylen home"
      ><img src="{{PREFIX}}assets/brand/logo.svg" alt="Haylen" width="126" height="38"
    /></a>
    <nav class="desktop-nav" aria-label="Main navigation">{{DESKTOP_NAV}}</nav>
    <a class="header-github" href="https://github.com/haylen-org/haylen"
      >{{ICON_GITHUB}}<span>GitHub</span>{{ICON_EXTERNAL_LINK}}</a
    ><button
      class="menu-toggle"
      id="menu-toggle"
      aria-expanded="false"
      aria-controls="mobile-nav"
      aria-label="Open navigation"
    >
      <span></span><span></span>
    </button>
  </div>
  <nav id="mobile-nav" class="mobile-nav container" aria-label="Mobile navigation" hidden>{{MOBILE_NAV}}</nav>
</header>
