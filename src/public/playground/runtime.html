<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Haylen game preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #102c46;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        color: #bceafa;
        font: 14px system-ui;
        background: #101820;
      }
      #loading[hidden] {
        display: none;
      }
    </style>
    <script type="module" src="./runtime-host.js"></script>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Game. Use arrow keys to move and Space to jump."></canvas>
    <div id="loading">Starting Haylen…</div>
  </body>
</html>
